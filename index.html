<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KikeFlix Player PRO</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<style>
html, body { 
    margin: 0; 
    padding: 0; 
    background: black; 
    height: 100%; 
    overflow: hidden; 
    font-family: sans-serif; 
}
#player { 
    position: relative; 
    width: 100%; 
    height: 100vh; 
    background: black; 
}
.video-wrapper { 
    position: absolute; 
    top: 0; left: 0; 
    width: 100%; 
    height: 100%; 
    display: none; 
}
video, iframe { 
    width: 100%; 
    height: 100%; 
    object-fit: contain; 
    background: black; 
    border: none; 
    position: absolute; 
    top: 0; 
    left: 0; 
}
#bloqueo-flecha { 
    position: absolute; 
    top: 0; right: 0; 
    width: 180px; height: 60px; 
    z-index: 1000; 
    display: none; 
}
.controls { 
    position: absolute; 
    bottom: 0; 
    width: 100%; 
    padding: 15px; 
    box-sizing: border-box; 
    background: linear-gradient(to top, rgba(0,0,0,0.92), transparent); 
    opacity: 0; 
    pointer-events: none;
    transition: opacity 0.3s; 
    z-index: 10; 
}
.controls.show { 
    opacity: 1; 
    pointer-events: auto;
}
.btn { 
    color: white !important; 
    font-size: 16px; 
    cursor: pointer; 
    margin-right: 12px; 
    text-shadow: 0 0 5px rgba(142, 68, 173, 0.8); 
    outline: none; 
    -webkit-tap-highlight-color: transparent !important; 
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    user-select: none; 
    transition: color 0.1s ease, background 0.1s ease;
    border-radius: 8px;
    height: 36px;
}
.btn:hover, .btn:focus, .btn:active { 
    color: #bc13fe !important; 
    text-shadow: 0 0 10px #bc13fe;
    background: rgba(188,19,254,0.1);
}
.btn.paused-frame {
    border: 1px solid rgba(188, 19, 254, 0.7);
    box-shadow: 0 0 12px rgba(188, 19, 254, 0.45);
    background: rgba(142, 68, 173, 0.12);
}
.progress { 
    width: 100%; 
    height: 5px; 
    background: rgba(255,255,255,0.15); 
    cursor: pointer; 
    margin-bottom: 10px; 
    border-radius: 3px; 
    overflow: hidden; 
    position: relative;
}
.progress:hover { height: 10px; }
.progress-bar { 
    height: 100%; 
    width: 0%; 
    background: linear-gradient(90deg, #8e44ad, #bc13fe); 
    box-shadow: 0 0 10px #bc13fe; 
    transition: width 0.1s linear; 
}
.progress-buffer {
    position: absolute;
    height: 100%;
    top: 0; left: 0;
    background: rgba(255,255,255,0.12);
    border-radius: 3px;
}
.center-play { 
    position: absolute; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%) scale(1); 
    width: 80px; height: 80px; 
    border-radius: 50%; 
    background: rgba(142, 68, 173, 0.35); 
    border: 2px solid #bc13fe; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer; 
    transition: 0.3s; 
    z-index: 5; 
    box-shadow: 0 0 25px rgba(188, 19, 254, 0.5);
    opacity: 0;
    pointer-events: none;
}
.center-play.visible {
    opacity: 1;
    pointer-events: auto;
}
.center-play:hover {
    background: rgba(142, 68, 173, 0.55);
    box-shadow: 0 0 35px rgba(188, 19, 254, 0.7);
    transform: translate(-50%, -50%) scale(1.1);
}
.center-play::before { 
    content: ''; 
    margin-left: 5px; 
    border-left: 25px solid white; 
    border-top: 15px solid transparent; 
    border-bottom: 15px solid transparent; 
}
#overlay { 
    position: absolute; 
    width: 100%; height: 100%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    background: #000; 
    z-index: 2000; 
}
#btn-entrar { 
    width: 90px; height: 90px; 
    cursor: pointer; 
    background: linear-gradient(135deg, #8e44ad, #bc13fe); 
    color: white; 
    border: none; 
    border-radius: 50%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    transition: transform 0.2s; 
    box-shadow: 0 0 25px rgba(188,19,254,0.6); 
}
#btn-entrar:hover { transform: scale(1.1); box-shadow: 0 0 40px rgba(188,19,254,0.8); }
.play-icon { 
    width: 0; height: 0; 
    border-top: 22px solid transparent; 
    border-bottom: 22px solid transparent; 
    border-left: 38px solid white; 
    margin-left: 8px; 
}
#timer { 
    position: absolute; 
    top: 20px; right: 20px; 
    background: rgba(0,0,0,0.85); 
    color: white; 
    padding: 10px 16px; 
    border-radius: 8px; 
    z-index: 2010; 
    display: none; 
    font-size: 14px;
    border: 1px solid rgba(188,19,254,0.3);
}
#skipBtn { 
    display: none; position: absolute; bottom: 80px; right: 20px; 
    z-index: 2020; padding: 12px 24px; 
    background: linear-gradient(135deg, #8e44ad, #bc13fe); 
    color: white; border: none; border-radius: 25px; 
    cursor: pointer; font-size: 14px;
    box-shadow: 0 0 20px rgba(188,19,254,0.5); 
}

/* Volumen vertical */
.volume-container {
    position: relative;
    display: inline-flex;
    align-items: center;
    margin-right: 12px;
}
.volume-slider-wrapper {
    position: absolute;
    bottom: calc(100% + 12px);
    left: 50%;
    transform: translateX(-50%);
    width: 34px; height: 110px;
    background: rgba(0,0,0,0.8);
    border-radius: 18px;
    display: none;
    justify-content: center;
    align-items: center;
    border: 1px solid rgba(188,19,254,0.35);
    box-shadow: 0 0 15px rgba(188,19,254,0.2);
    z-index: 20;
}
.volume-container:hover .volume-slider-wrapper,
.volume-container.active .volume-slider-wrapper {
    display: flex;
}
#volumeSlider {
    -webkit-appearance: none;
    width: 80px; height: 4px;
    background: rgba(188,19,254,0.35);
    border-radius: 2px;
    outline: none;
    transform: rotate(-90deg);
    cursor: pointer;
}
#volumeSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: #bc13fe; border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(188,19,254,0.9);
}
#volumeSlider::-moz-range-thumb {
    width: 14px; height: 14px;
    background: #bc13fe; border-radius: 50%;
    cursor: pointer;
    border: none;
}

/* Settings */
.settings-container {
    position: relative;
    display: inline-block;
}
.settings-menu {
    position: absolute;
    bottom: calc(100% + 12px);
    right: 0;
    background: rgba(8,0,18,0.94);
    border: 1px solid rgba(188,19,254,0.4);
    border-radius: 12px;
    padding: 0;
    min-width: 250px;
    display: none;
    color: white;
    font-size: 13px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 25px rgba(188,19,254,0.2), 0 8px 32px rgba(0,0,0,0.6);
    z-index: 20;
    overflow: hidden;
    max-height: 60vh;
    overflow-y: auto;
}
.settings-container.active .settings-menu {
    display: block;
}
.settings-header {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    color: #bc13fe;
    border-bottom: 1px solid rgba(188,19,254,0.2);
    display: flex;
    align-items: center;
    gap: 8px;
}
.settings-header.back-header {
    cursor: pointer;
    transition: background 0.15s;
}
.settings-header.back-header:hover {
    background: rgba(188,19,254,0.1);
}
.settings-item {
    padding: 11px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.15s;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}
.settings-item:hover {
    background: rgba(188,19,254,0.1);
}
.settings-item.selected {
    background: rgba(188,19,254,0.15);
}
.settings-item .s-label {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.settings-item .s-value {
    color: #bc13fe;
    font-size: 12px;
    margin-left: 12px;
    white-space: nowrap;
    font-weight: 600;
}
.settings-item .s-check {
    color: #bc13fe;
    margin-left: 8px;
    font-size: 14px;
}
.arrow::after {
    content: '\203A';
    color: rgba(255,255,255,0.5);
    font-size: 20px;
    margin-left: 8px;
}
.divider {
    height: 1px;
    background: rgba(188,19,254,0.2);
    margin: 4px 0;
}

/* Badges */
.lang-badge {
    position: absolute;
    top: 16px; left: 16px;
    background: rgba(0,0,0,0.75);
    color: #bc13fe;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    z-index: 6;
    display: none;
    border: 1px solid rgba(188,19,254,0.25);
}
.sub-badge {
    position: absolute;
    top: 16px; left: 100px;
    background: rgba(0,0,0,0.75);
    color: #FFD700;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    z-index: 6;
    display: none;
    border: 1px solid rgba(255,215,0,0.25);
}

/* Toast */
.toast-msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(10,0,20,0.88);
    color: white;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 15px;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    border: 1px solid rgba(188,19,254,0.3);
    text-align: center;
}
.toast-msg.visible {
    opacity: 1;
}

/* Speed */
.speed-btn {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    margin-right: 12px;
    transition: color 0.1s, background 0.1s;
}
.speed-btn:hover { color: #bc13fe; background: rgba(188,19,254,0.1); }

/* Switch */
.switch {
    position: relative;
    display: inline-block;
    width: 40px; height: 22px;
    flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider-sw {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.2);
    transition: .3s; border-radius: 22px;
}
.slider-sw:before {
    position: absolute; content: "";
    height: 16px; width: 16px;
    left: 3px; bottom: 3px;
    background: white; transition: .3s; border-radius: 50%;
}
input:checked + .slider-sw {
    background: #bc13fe;
    box-shadow: 0 0 10px rgba(188,19,254,0.6);
}
input:checked + .slider-sw:before {
    transform: translateX(18px);
}

@media(max-width:600px){
    .btn { font-size: 18px; min-width: 40px; height: 40px; }
    .settings-menu { min-width: 210px; font-size: 12px; }
}
</style>
</head>
<body oncontextmenu="return false">

<div id="player">
    <div id="overlay"><button id="btn-entrar"><div class="play-icon"></div></button></div>
    <div id="timer">Publicidad: <span id="seg">21</span>s</div>
    <button id="skipBtn">Saltar Publicidad ⏭</button>
    <div class="video-wrapper" id="wrapper-externo"><div id="bloqueo-flecha"></div><iframe id="videoFrame" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe></div>
    <video id="video" style="display: none;" playsinline></video>
    <button id="centerPlay" class="center-play"></button>
    <div class="lang-badge" id="langBadge"></div>
    <div class="sub-badge" id="subBadge">CC</div>
    <div class="toast-msg" id="toastMsg"></div>

    <div class="controls" id="custom-controls" style="display: none;">
        <div class="progress" id="progress"><div class="progress-buffer" id="bufferBar"></div><div class="progress-bar" id="bar"></div></div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; color: white; margin-top: 5px;">
            <div style="display: flex; align-items: center;">
                <span class="btn" id="playBtn">▶</span>
                <div class="volume-container" id="volumeContainer">
                    <span class="btn" id="muteBtn" style="margin-right: 0;">🔊</span>
                    <div class="volume-slider-wrapper">
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                    </div>
                </div>
                <span style="font-size: 12px; margin-right: 12px; opacity: 0.7;"><span id="currentTime">0:00</span> / <span id="totalTime">0:00</span></span>
            </div>
            <div style="display: flex; align-items: center;">
                <span class="speed-btn" id="speedBtn" title="Velocidad">1x</span>
                <div class="settings-container" id="settingsContainer">
                    <span class="btn" id="settingsBtn" style="margin-right: 0;">⚙️</span>
                    <div class="settings-menu" id="settingsMenu"></div>
                </div>
                <span class="btn" id="pipBtn" title="Imagen en imagen" style="margin-right: 0; display: none;">🖼</span>
                <span class="btn" id="fullscreenBtn">⛶</span>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// KikeFlix Player PRO — Funcional de verdad
// ============================================================

var video = document.getElementById("video"),
    playBtn = document.getElementById("playBtn"),
    muteBtn = document.getElementById("muteBtn"),
    fullscreenBtn = document.getElementById("fullscreenBtn"),
    centerPlay = document.getElementById("centerPlay"),
    progress = document.getElementById("progress"),
    bar = document.getElementById("bar"),
    bufferBar = document.getElementById("bufferBar"),
    controls = document.getElementById("custom-controls"),
    wrapperExterno = document.getElementById('wrapper-externo'),
    iframe = document.getElementById('videoFrame'),
    timerDiv = document.getElementById('timer'),
    segSpan = document.getElementById('seg'),
    overlay = document.getElementById('overlay'),
    bloqueoFlecha = document.getElementById('bloqueo-flecha'),
    volumeSlider = document.getElementById("volumeSlider"),
    volumeContainer = document.getElementById("volumeContainer"),
    settingsContainer = document.getElementById("settingsContainer"),
    settingsMenu = document.getElementById("settingsMenu"),
    settingsBtn = document.getElementById("settingsBtn"),
    player = document.getElementById("player"),
    skipBtn = document.getElementById("skipBtn"),
    langBadge = document.getElementById("langBadge"),
    subBadge = document.getElementById("subBadge"),
    toastMsg = document.getElementById("toastMsg"),
    speedBtn = document.getElementById("speedBtn"),
    pipBtn = document.getElementById("pipBtn");

// ===== Parámetros URL =====
var params = new URLSearchParams(window.location.search + window.location.hash.replace('#', '&'));
var videoUrl = params.get("video"),
    adUrl = params.get("ad"),
    subUrl = params.get("subtitle"),
    audioUrl = params.get("audio");

// ===== Idiomas =====
var LANG_NAMES = {
    es:'Español', en:'English', pt:'Português', fr:'Français', de:'Deutsch',
    it:'Italiano', ja:'日本語', zh:'中文', ko:'한국어', ar:'العربية', ru:'Русский',
    ca:'Català', eu:'Euskera', gl:'Galego', va:'Valencià', qu:'Quechua',
    ay:'Aymara', gn:'Guaraní', nah:'Náhuatl', spa:'Español', eng:'English',
    por:'Português', fre:'Français', ger:'Deutsch', ita:'Italiano',
    und:'Original', zxx:'Sin voz', qaa:'Original',
    'es-419':'Español LatAm', 'es-MX':'Español México', 'es-AR':'Español Argentina',
    'es-CO':'Español Colombia', 'es-ES':'Español España',
};
function langName(code) {
    if (!code) return 'Original';
    return LANG_NAMES[code] || LANG_NAMES[code.split('-')[0]] || code;
}

// ===== Estado =====
var hlsPlayer = null, dashPlayer = null;
var currentAudioIdx = -1, currentSubIdx = -1;
var availableAudio = [], availableSubs = [];
var menuPage = 'main';
var playbackRate = 1;
var SPEEDS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
var externalAudioEl = null;

// ===== Tipo de contenido =====
function tipo(u) {
    if (!u) return "vacio";
    var l = u.toLowerCase();
    if (l.includes("drive.google.com")) return "drive";
    if (l.includes(".m3u8")) return "hls";
    if (l.includes(".mpd")) return "dash";
    if (l.match(/\.(mp4|mkv|webm|avi)/i) || l.includes("/series/") || l.includes("/movie/") || l.includes("/live/")) return "mp4";
    return "embed";
}
var tipoCont = tipo(videoUrl);

// ===== Toast =====
var toastTimer = null;
function showToast(msg, dur) {
    dur = dur || 1500;
    toastMsg.textContent = msg;
    toastMsg.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toastMsg.classList.remove('visible'); }, dur);
}

// ===== Formato tiempo =====
function formatTime(s) {
    if (isNaN(s)) return "0:00";
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ":" + (sec < 10 ? "0" : "") + sec;
}

// ===== Toggle play/pause =====
function togglePlay() {
    if (video.paused) {
        video.play().catch(function(){});
    } else {
        video.pause();
    }
}

playBtn.onclick = togglePlay;
centerPlay.onclick = togglePlay;

video.onplay = function() {
    centerPlay.classList.remove("visible");
    playBtn.innerText = "⏸";
    playBtn.classList.add("paused-frame");
};
video.onpause = function() {
    centerPlay.classList.add("visible");
    playBtn.innerText = "▶";
    playBtn.classList.add("paused-frame");
};

// ===== Mute =====
muteBtn.onclick = function() {
    if (externalAudioEl) {
        externalAudioEl.muted = !externalAudioEl.muted;
        video.muted = externalAudioEl.muted;
        muteBtn.innerText = externalAudioEl.muted ? "🔇" : "🔊";
    } else {
        video.muted = !video.muted;
        muteBtn.innerText = video.muted ? "🔇" : "🔊";
    }
};

// ===== Volume =====
volumeSlider.oninput = function(e) {
    var v = parseFloat(e.target.value);
    video.volume = v;
    video.muted = (v === 0);
    if (externalAudioEl) { externalAudioEl.volume = v; externalAudioEl.muted = (v === 0); }
    muteBtn.innerText = (v === 0) ? "🔇" : "🔊";
};

// ===== Fullscreen =====
fullscreenBtn.onclick = function() {
    if (!document.fullscreenElement) player.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
};

// ===== Progress =====
video.ontimeupdate = function() {
    if (video.duration) {
        bar.style.width = (video.currentTime / video.duration) * 100 + "%";
        document.getElementById("currentTime").innerText = formatTime(video.currentTime);
        document.getElementById("totalTime").innerText = formatTime(video.duration);
    }
};
video.onprogress = function() {
    if (video.buffered.length > 0 && video.duration) {
        var end = video.buffered.end(video.buffered.length - 1);
        bufferBar.style.width = (end / video.duration) * 100 + "%";
    }
};
progress.onclick = function(e) {
    var rect = progress.getBoundingClientRect();
    video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
};

// ===== Speed =====
speedBtn.onclick = function() {
    var cur = SPEEDS.indexOf(playbackRate);
    var next = (cur + 1) % SPEEDS.length;
    playbackRate = SPEEDS[next];
    video.playbackRate = playbackRate;
    if (externalAudioEl) externalAudioEl.playbackRate = playbackRate;
    speedBtn.innerText = playbackRate + 'x';
    showToast('Velocidad: ' + playbackRate + 'x');
};

// ===== PiP =====
if (document.pictureInPictureEnabled) {
    pipBtn.style.display = '';
}
pipBtn.onclick = function() {
    try {
        if (document.pictureInPictureElement) document.exitPictureInPicture();
        else video.requestPictureInPicture();
    } catch(e) { showToast('PiP no disponible'); }
};

// ============================================================
// SISTEMA DE AUDIO E IDIOMA
// ============================================================

function detectAudioTracks() {
    availableAudio = [];
    
    // HLS.js audio tracks
    if (hlsPlayer && hlsPlayer.audioTracks && hlsPlayer.audioTracks.length > 0) {
        hlsPlayer.audioTracks.forEach(function(track, i) {
            availableAudio.push({
                label: langName(track.lang || track.name) + (track.name ? ' (' + track.name + ')' : ''),
                lang: track.lang,
                type: 'hls',
                index: i
            });
        });
        if (currentAudioIdx === -1) currentAudioIdx = hlsPlayer.audioTrack;
    }
    // DASH audio tracks
    else if (dashPlayer) {
        try {
            var tracks = dashPlayer.getTracksFor('audio');
            if (tracks && tracks.length > 0) {
                tracks.forEach(function(track, i) {
                    availableAudio.push({
                        label: langName(track.lang) + (track.label ? ' - ' + track.label : '') + (track.roles ? ' [' + track.roles.join(',') + ']' : ''),
                        lang: track.lang,
                        type: 'dash',
                        index: i,
                        dashTrack: track
                    });
                });
                if (currentAudioIdx === -1) currentAudioIdx = 0;
            }
        } catch(e) {}
    }
    // HTML5 native audioTracks
    else if (video.audioTracks && video.audioTracks.length > 0) {
        for (var i = 0; i < video.audioTracks.length; i++) {
            var t = video.audioTracks[i];
            availableAudio.push({
                label: langName(t.language) + (t.label ? ' - ' + t.label : ''),
                lang: t.language,
                type: 'native',
                index: i
            });
        }
        if (currentAudioIdx === -1) currentAudioIdx = 0;
    }
    
    // Audio externo por URL
    if (audioUrl) {
        availableAudio.push({
            label: '📁 Audio externo',
            type: 'external',
            url: audioUrl
        });
    }
    
    updateLangBadge();
}

function setAudioTrack(idx) {
    if (idx < 0 || idx >= availableAudio.length) return;
    var track = availableAudio[idx];
    
    if (track.type === 'hls' && hlsPlayer) {
        hlsPlayer.audioTrack = track.index;
        currentAudioIdx = idx;
        showToast('🔊 ' + track.label);
    } else if (track.type === 'dash' && dashPlayer) {
        try {
            dashPlayer.setCurrentTrack(track.dashTrack);
            currentAudioIdx = idx;
            showToast('🔊 ' + track.label);
        } catch(e) { showToast('Error al cambiar audio'); }
    } else if (track.type === 'native') {
        for (var i = 0; i < video.audioTracks.length; i++) {
            video.audioTracks[i].enabled = (i === track.index);
        }
        currentAudioIdx = idx;
        showToast('🔊 ' + track.label);
    } else if (track.type === 'external') {
        loadExternalAudio(track.url);
        currentAudioIdx = idx;
    }
    
    updateLangBadge();
    menuPage = 'main'; buildMenu();
}

function loadExternalAudio(url) {
    if (externalAudioEl) { externalAudioEl.pause(); externalAudioEl.remove(); }
    externalAudioEl = document.createElement('audio');
    externalAudioEl.src = url;
    externalAudioEl.volume = video.volume;
    
    // Silenciar video original, sincronizar audio externo
    video.muted = true;
    muteBtn.innerText = '🔊';
    
    video.addEventListener('play', function() { externalAudioEl.play().catch(function(){}); });
    video.addEventListener('pause', function() { externalAudioEl.pause(); });
    video.addEventListener('seeked', function() { externalAudioEl.currentTime = video.currentTime; });
    
    // Override volume to control external audio
    volumeSlider.oninput = function(e) {
        var v = parseFloat(e.target.value);
        externalAudioEl.volume = v;
        externalAudioEl.muted = (v === 0);
        muteBtn.innerText = (v === 0) ? '🔇' : '🔊';
    };
    
    muteBtn.onclick = function() {
        externalAudioEl.muted = !externalAudioEl.muted;
        video.muted = true; // video stays muted
        muteBtn.innerText = externalAudioEl.muted ? '🔇' : '🔊';
    };
    
    externalAudioEl.play().catch(function(){});
    showToast('🔊 Audio externo cargado');
}

function updateLangBadge() {
    if (availableAudio.length > 1 && currentAudioIdx >= 0) {
        langBadge.textContent = availableAudio[currentAudioIdx]?.label || '';
        langBadge.style.display = 'block';
        setTimeout(function() { langBadge.style.display = 'none'; }, 4000);
    } else {
        langBadge.style.display = 'none';
    }
}

// ============================================================
// SISTEMA DE SUBTÍTULOS
// ============================================================

function detectSubtitleTracks() {
    availableSubs = [];
    
    // HLS.js subtitle tracks
    if (hlsPlayer && hlsPlayer.subtitleTracks && hlsPlayer.subtitleTracks.length > 0) {
        hlsPlayer.subtitleTracks.forEach(function(track, i) {
            availableSubs.push({
                label: langName(track.lang || track.name) + (track.name ? ' (' + track.name + ')' : ''),
                lang: track.lang,
                type: 'hls',
                index: i
            });
        });
    }
    // DASH text tracks
    else if (dashPlayer) {
        try {
            var tracks = dashPlayer.getTracksFor('text');
            if (tracks && tracks.length > 0) {
                tracks.forEach(function(track, i) {
                    availableSubs.push({
                        label: langName(track.lang) + (track.label ? ' - ' + track.label : ''),
                        lang: track.lang,
                        type: 'dash',
                        index: i,
                        dashTrack: track
                    });
                });
            }
        } catch(e) {}
    }
    
    // HTML5 textTracks
    if (video.textTracks && video.textTracks.length > 0) {
        for (var i = 0; i < video.textTracks.length; i++) {
            var t = video.textTracks[i];
            var alreadyExists = availableSubs.some(function(s) {
                return s.lang === t.language && s.type !== 'external';
            });
            if (!alreadyExists) {
                availableSubs.push({
                    label: langName(t.language) + (t.label ? ' - ' + t.label : ''),
                    lang: t.language,
                    type: 'native',
                    index: i
                });
            }
        }
    }
    
    // Subtítulo externo por URL
    if (subUrl) {
        availableSubs.push({
            label: '📁 Subtítulo externo',
            lang: 'ext',
            type: 'external-url',
            url: subUrl
        });
    }
    
    updateSubBadge();
}

function setSubtitleTrack(idx) {
    // Desactivar todos
    if (video.textTracks) {
        for (var i = 0; i < video.textTracks.length; i++) {
            video.textTracks[i].mode = 'hidden';
        }
    }
    if (hlsPlayer && hlsPlayer.subtitleTrack !== undefined) {
        hlsPlayer.subtitleTrack = -1;
    }
    if (dashPlayer) {
        try { dashPlayer.setTextTrack(-1); } catch(e) {}
    }
    
    currentSubIdx = idx;
    
    if (idx >= 0 && idx < availableSubs.length) {
        var track = availableSubs[idx];
        
        if (track.type === 'hls' && hlsPlayer) {
            hlsPlayer.subtitleTrack = track.index;
            // Activar el textTrack del video
            setTimeout(function() {
                for (var i = 0; i < video.textTracks.length; i++) {
                    var tt = video.textTracks[i];
                    if (tt.language === track.lang || i === track.index) {
                        tt.mode = 'showing';
                    }
                }
            }, 500);
            showToast('💬 ' + track.label);
            
        } else if (track.type === 'dash' && dashPlayer) {
            try {
                dashPlayer.setTextTrack(track.dashTrack.index);
                setTimeout(function() {
                    for (var i = 0; i < video.textTracks.length; i++) {
                        video.textTracks[i].mode = (i === video.textTracks.length - 1) ? 'showing' : 'hidden';
                    }
                }, 500);
                showToast('💬 ' + track.label);
            } catch(e) { showToast('Error con subtítulos'); }
            
        } else if (track.type === 'native') {
            video.textTracks[track.index].mode = 'showing';
            showToast('💬 ' + track.label);
            
        } else if (track.type === 'external-vtt') {
            // El track ya fue añadido al video
            var lastTT = video.textTracks[video.textTracks.length - 1];
            if (lastTT) lastTT.mode = 'showing';
            showToast('💬 Subtítulos externos ON');
            
        } else if (track.type === 'external-url') {
            loadExternalSubtitleUrl(track.url);
            showToast('💬 Cargando subtítulos...');
        }
    } else {
        showToast('💬 Subtítulos OFF');
    }
    
    updateSubBadge();
    menuPage = 'main'; buildMenu();
}

// ===== Cargar subtítulo externo (archivo local) =====
function loadExternalSubtitle() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.vtt,.srt,.ass,.ssa';
    input.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            var text = ev.target.result;
            if (file.name.endsWith('.srt')) text = srtToVtt(text);
            var blob = new Blob([text], { type: 'text/vtt' });
            var blobUrl = URL.createObjectURL(blob);
            addVttTrack(blobUrl, file.name);
        };
        reader.readAsText(file);
    };
    input.click();
}

// ===== Cargar subtítulo externo (URL) =====
function loadExternalSubtitleUrl(url) {
    fetch(url).then(function(r) { return r.text(); }).then(function(text) {
        if (url.toLowerCase().endsWith('.srt')) text = srtToVtt(text);
        var blob = new Blob([text], { type: 'text/vtt' });
        var blobUrl = URL.createObjectURL(blob);
        addVttTrack(blobUrl, 'Externo URL');
    }).catch(function() {
        // Si fetch falla (CORS), añadir URL directamente
        addVttTrack(url, 'Externo URL');
    });
}

// ===== Añadir track VTT al video =====
function addVttTrack(url, label) {
    var track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = label || 'Externo';
    track.srclang = 'ext';
    track.src = url;
    track.default = true;
    video.appendChild(track);
    
    setTimeout(function() {
        var tt = video.textTracks[video.textTracks.length - 1];
        if (tt) tt.mode = 'showing';
        currentSubIdx = availableSubs.length;
        availableSubs.push({
            label: '📁 ' + (label || 'Externo'),
            lang: 'ext',
            type: 'external-vtt',
            index: video.textTracks.length - 1
        });
        updateSubBadge();
        buildMenu();
    }, 300);
}

// ===== SRT → VTT =====
function srtToVtt(srt) {
    var vtt = 'WEBVTT\n\n';
    var blocks = srt.trim().split(/\n\n+/);
    blocks.forEach(function(block) {
        var lines = block.trim().split('\n');
        if (lines.length < 2) return;
        var timeIdx = lines[0].includes('-->') ? 0 : 1;
        var timeLine = lines[timeIdx].replace(/,/g, '.');
        var text = lines.slice(timeIdx + 1).join('\n');
        if (timeLine.includes('-->')) {
            vtt += timeLine + '\n' + text + '\n\n';
        }
    });
    return vtt;
}

function updateSubBadge() {
    subBadge.style.display = (currentSubIdx >= 0) ? 'block' : 'none';
    if (currentSubIdx >= 0) {
        setTimeout(function() { subBadge.style.display = 'none'; }, 4000);
    }
}

// ============================================================
// MENÚ DE CONFIGURACIÓN
// ============================================================

function buildMenu() {
    var html = '';
    
    if (menuPage === 'main') {
        html += '<div class="settings-header">⚙️ Configuración</div>';
        
        // Idioma / Audio
        var audioLabel = (availableAudio.length > 0 && currentAudioIdx >= 0)
            ? availableAudio[currentAudioIdx].label : 'Original';
        html += '<div class="settings-item arrow" data-page="audio">';
        html += '<span class="s-label">🔊 Idioma / Audio</span>';
        html += '<span class="s-value">' + audioLabel + '</span></div>';
        
        // Subtítulos
        var subLabel = (currentSubIdx >= 0) ? availableSubs[currentSubIdx].label : 'Desactivados';
        html += '<div class="settings-item arrow" data-page="subtitle">';
        html += '<span class="s-label">💬 Subtítulos</span>';
        html += '<span class="s-value">' + subLabel + '</span></div>';
        
        // Calidad (solo HLS)
        if (tipoCont === 'hls' && hlsPlayer && hlsPlayer.levels && hlsPlayer.levels.length > 1) {
            var q = hlsPlayer.currentLevel;
            var qLabel = (q >= 0 && hlsPlayer.levels[q]) ? hlsPlayer.levels[q].height + 'p' : 'Auto';
            html += '<div class="settings-item arrow" data-page="quality">';
            html += '<span class="s-label">📊 Calidad</span>';
            html += '<span class="s-value">' + qLabel + '</span></div>';
        }
        
        // Velocidad
        html += '<div class="settings-item arrow" data-page="speed">';
        html += '<span class="s-label">⏩ Velocidad</span>';
        html += '<span class="s-value">' + playbackRate + 'x</span></div>';
        
    } else if (menuPage === 'audio') {
        html += '<div class="settings-header back-header" data-page="main">‹ 🔊 Idioma / Audio</div>';
        if (availableAudio.length === 0) {
            html += '<div class="settings-item"><span class="s-label" style="opacity:.5">No hay pistas de audio disponibles</span></div>';
        } else {
            availableAudio.forEach(function(a, i) {
                var sel = (i === currentAudioIdx);
                html += '<div class="settings-item' + (sel ? ' selected' : '') + '" data-audio="' + i + '">';
                html += '<span class="s-label">' + a.label + '</span>';
                html += (sel ? '<span class="s-check">✓</span>' : '') + '</div>';
            });
        }
        html += '<div class="divider"></div>';
        html += '<div class="settings-item" data-audio="load">';
        html += '<span class="s-label">📁 Cargar audio externo (mp3/m4a)</span></div>';
        
    } else if (menuPage === 'subtitle') {
        html += '<div class="settings-header back-header" data-page="main">‹ 💬 Subtítulos</div>';
        html += '<div class="settings-item' + (currentSubIdx === -1 ? ' selected' : '') + '" data-sub="-1">';
        html += '<span class="s-label">Desactivados</span>';
        html += (currentSubIdx === -1 ? '<span class="s-check">✓</span>' : '') + '</div>';
        
        availableSubs.forEach(function(s, i) {
            var sel = (i === currentSubIdx);
            html += '<div class="settings-item' + (sel ? ' selected' : '') + '" data-sub="' + i + '">';
            html += '<span class="s-label">' + s.label + '</span>';
            html += (sel ? '<span class="s-check">✓</span>' : '') + '</div>';
        });
        
        html += '<div class="divider"></div>';
        html += '<div class="settings-item" data-sub="load">';
        html += '<span class="s-label">📁 Cargar subtítulo (.vtt / .srt)</span></div>';
        
    } else if (menuPage === 'quality') {
        html += '<div class="settings-header back-header" data-page="main">‹ 📊 Calidad</div>';
        if (hlsPlayer) {
            var levels = hlsPlayer.levels || [];
            html += '<div class="settings-item' + (hlsPlayer.currentLevel === -1 ? ' selected' : '') + '" data-q="-1">';
            html += '<span class="s-label">AUTO</span>';
            html += (hlsPlayer.currentLevel === -1 ? '<span class="s-check">✓</span>' : '') + '</div>';
            levels.forEach(function(l, i) {
                var sel = (i === hlsPlayer.currentLevel);
                var lab = l.height + 'p';
                html += '<div class="settings-item' + (sel ? ' selected' : '') + '" data-q="' + i + '">';
                html += '<span class="s-label">' + lab + '</span>';
                html += (sel ? '<span class="s-check">✓</span>' : '') + '</div>';
            });
        }
        
    } else if (menuPage === 'speed') {
        html += '<div class="settings-header back-header" data-page="main">‹ ⏩ Velocidad</div>';
        SPEEDS.forEach(function(s) {
            var sel = (s === playbackRate);
            html += '<div class="settings-item' + (sel ? ' selected' : '') + '" data-speed="' + s + '">';
            html += '<span class="s-label">' + s + 'x</span>';
            html += (sel ? '<span class="s-check">✓</span>' : '') + '</div>';
        });
    }
    
    settingsMenu.innerHTML = html;
    bindMenuEvents();
}

function bindMenuEvents() {
    // Back headers
    settingsMenu.querySelectorAll('.back-header').forEach(function(el) {
        el.onclick = function(e) {
            e.stopPropagation();
            menuPage = el.dataset.page;
            buildMenu();
        };
    });
    
    // Submenu navigation
    settingsMenu.querySelectorAll('[data-page]').forEach(function(el) {
        if (!el.classList.contains('back-header')) {
            el.onclick = function(e) {
                e.stopPropagation();
                menuPage = el.dataset.page;
                buildMenu();
            };
        }
    });
    
    // Audio selection
    settingsMenu.querySelectorAll('[data-audio]').forEach(function(el) {
        el.onclick = function(e) {
            e.stopPropagation();
            if (el.dataset.audio === 'load') {
                var url = prompt('URL del archivo de audio (mp3, m4a, ogg):');
                if (url && url.trim()) loadExternalAudio(url.trim());
                settingsContainer.classList.remove('active');
            } else {
                setAudioTrack(parseInt(el.dataset.audio));
            }
        };
    });
    
    // Subtitle selection
    settingsMenu.querySelectorAll('[data-sub]').forEach(function(el) {
        el.onclick = function(e) {
            e.stopPropagation();
            if (el.dataset.sub === 'load') {
                loadExternalSubtitle();
                settingsContainer.classList.remove('active');
            } else if (el.dataset.sub === '-1') {
                setSubtitleTrack(-1);
            } else {
                setSubtitleTrack(parseInt(el.dataset.sub));
            }
        };
    });
    
    // Quality selection
    settingsMenu.querySelectorAll('[data-q]').forEach(function(el) {
        el.onclick = function(e) {
            e.stopPropagation();
            if (hlsPlayer) {
                hlsPlayer.currentLevel = parseInt(el.dataset.q);
                menuPage = 'main'; buildMenu();
                var q = parseInt(el.dataset.q);
                showToast(q === -1 ? 'Calidad: AUTO' : 'Calidad: ' + hlsPlayer.levels[q].height + 'p');
            }
        };
    });
    
    // Speed selection
    settingsMenu.querySelectorAll('[data-speed]').forEach(function(el) {
        el.onclick = function(e) {
            e.stopPropagation();
            playbackRate = parseFloat(el.dataset.speed);
            video.playbackRate = playbackRate;
            if (externalAudioEl) externalAudioEl.playbackRate = playbackRate;
            speedBtn.innerText = playbackRate + 'x';
            menuPage = 'main'; buildMenu();
            showToast('Velocidad: ' + playbackRate + 'x');
        };
    });
}

// ===== Settings toggle =====
settingsBtn.onclick = function(e) {
    e.stopPropagation();
    menuPage = 'main';
    settingsContainer.classList.toggle('active');
    if (settingsContainer.classList.contains('active')) {
        detectAudioTracks();
        detectSubtitleTracks();
        buildMenu();
    }
};
document.addEventListener('click', function(e) {
    if (!settingsContainer.contains(e.target)) {
        settingsContainer.classList.remove('active');
    }
});

// ============================================================
// AUTO-HIDE CONTROLES
// ============================================================

var hideTimer = null;
var mouseOverUI = false;

controls.addEventListener('mouseenter', function() { mouseOverUI = true; });
controls.addEventListener('mouseleave', function() { mouseOverUI = false; });
volumeContainer.addEventListener('mouseenter', function() { mouseOverUI = true; });
volumeContainer.addEventListener('mouseleave', function() { mouseOverUI = false; });
settingsContainer.addEventListener('mouseenter', function() { mouseOverUI = true; });
settingsContainer.addEventListener('mouseleave', function() { mouseOverUI = false; });
centerPlay.addEventListener('mouseenter', function() { mouseOverUI = true; });
centerPlay.addEventListener('mouseleave', function() { mouseOverUI = false; });

function showAllControls() {
    controls.classList.add("show");
    if (video.paused) centerPlay.classList.add("visible");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() {
        if (!mouseOverUI && !video.paused) {
            controls.classList.remove("show");
            centerPlay.classList.remove("visible");
            settingsContainer.classList.remove('active');
        } else if (mouseOverUI || video.paused) {
            showAllControls();
        }
    }, 3000);
}

['mousemove','click','touchstart','keydown'].forEach(function(evt) {
    player.addEventListener(evt, showAllControls);
});

// ============================================================
// TECLADO
// ============================================================

document.addEventListener('keydown', function(e) {
    if (tipoCont === 'embed' || tipoCont === 'drive' || tipoCont === 'vacio') return;
    switch(e.key) {
        case ' ': case 'k': e.preventDefault(); togglePlay(); break;
        case 'f': e.preventDefault(); fullscreenBtn.click(); break;
        case 'm': e.preventDefault(); muteBtn.click(); break;
        case 'ArrowLeft': e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 10); showToast('⏪ -10s'); break;
        case 'ArrowRight': e.preventDefault(); video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); showToast('⏩ +10s'); break;
        case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); volumeSlider.value = video.volume; showToast('🔊 ' + Math.round(video.volume*100) + '%'); break;
        case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); volumeSlider.value = video.volume; showToast('🔊 ' + Math.round(video.volume*100) + '%'); break;
        case 'c': e.preventDefault(); setSubtitleTrack(currentSubIdx >= 0 ? -1 : (availableSubs.length > 0 ? 0 : -1)); break;
        case 'a': e.preventDefault(); if (availableAudio.length > 1) { setAudioTrack((currentAudioIdx + 1) % availableAudio.length); } break;
        case 'p': e.preventDefault(); pipBtn.click(); break;
    }
});

// ============================================================
// EJECUTAR CONTENIDO
// ============================================================

function ejecutarContenidoReal() {
    wrapperExterno.style.display = 'none';
    video.style.display = 'none';
    controls.style.display = 'none';
    centerPlay.classList.remove("visible");
    
    if (tipoCont === "drive") {
        wrapperExterno.style.display = 'block';
        iframe.removeAttribute('sandbox');
        bloqueoFlecha.style.display = 'block';
        if (videoUrl.includes("/view")) videoUrl = videoUrl.replace("/view", "/preview");
        iframe.src = videoUrl + (videoUrl.includes('?') ? '&' : '?') + 'autoplay=1';
    } else if (tipoCont === "mp4") {
        video.style.display = 'block';
        controls.style.display = 'block';
        centerPlay.classList.add("visible");
        video.src = videoUrl;
        video.play().catch(function(){});
    } else if (tipoCont === "hls") {
        video.style.display = 'block';
        controls.style.display = 'block';
        centerPlay.classList.add("visible");
        if (Hls.isSupported()) {
            hlsPlayer = new Hls({
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                startLevel: -1
            });
            hlsPlayer.loadSource(videoUrl);
            hlsPlayer.attachMedia(video);
            hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(){});
                detectAudioTracks();
                detectSubtitleTracks();
                if (subUrl) loadExternalSubtitleUrl(subUrl);
            });
            hlsPlayer.on(Hls.Events.AUDIO_TRACKS_UPDATED, function() {
                detectAudioTracks();
                buildMenu();
            });
            hlsPlayer.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, function() {
                detectSubtitleTracks();
                buildMenu();
            });
            hlsPlayer.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            showToast('⚠️ Error de red, reintentando...');
                            hlsPlayer.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            showToast('⚠️ Error media, recuperando...');
                            hlsPlayer.recoverMediaError();
                            break;
                        default:
                            showToast('❌ Error fatal');
                            hlsPlayer.destroy();
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoUrl;
            video.play().catch(function(){});
            setTimeout(function() { detectAudioTracks(); detectSubtitleTracks(); }, 2000);
        }
    } else if (tipoCont === "dash") {
        video.style.display = 'block';
        controls.style.display = 'block';
        centerPlay.classList.add("visible");
        dashPlayer = dashjs.MediaPlayer().create();
        dashPlayer.initialize(video, videoUrl, true);
        dashPlayer.updateSettings({ streaming: { text: { defaultEnabled: true } } });
        setTimeout(function() {
            detectAudioTracks();
            detectSubtitleTracks();
            if (subUrl) loadExternalSubtitleUrl(subUrl);
        }, 1500);
    } else {
        wrapperExterno.style.display = 'block';
        iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin');
        iframe.src = videoUrl;
    }
    
    // Detectar tracks al cargar metadata
    if (tipoCont === 'mp4' || tipoCont === 'hls' || tipoCont === 'dash') {
        video.onloadedmetadata = function() {
            detectAudioTracks();
            detectSubtitleTracks();
        };
        showAllControls();
    }
}

// ============================================================
// OVERLAY ENTRADA + PUBLICIDAD
// ============================================================

document.getElementById('btn-entrar').onclick = function() {
    overlay.style.display = 'none';
    if (!videoUrl) return;

    if (adUrl) {
        wrapperExterno.style.display = 'block';
        iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin');
        iframe.src = adUrl.includes('?') ? adUrl + '&autoplay=1' : adUrl + '?autoplay=1';
        
        timerDiv.style.display = 'block';
        var timeLeft = 21;
        
        var countdown = setInterval(function() {
            timeLeft--;
            segSpan.innerText = timeLeft;
            
            if (timeLeft <= 16) skipBtn.style.display = 'block';
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDiv.style.display = 'none';
                skipBtn.style.display = 'none';
                ejecutarContenidoReal();
            }
        }, 1000);

        skipBtn.onclick = function() {
            clearInterval(countdown);
            timerDiv.style.display = 'none';
            skipBtn.style.display = 'none';
            ejecutarContenidoReal();
        };
    } else {
        ejecutarContenidoReal();
    }
};

if (video.muted) muteBtn.innerText = "🔇";
